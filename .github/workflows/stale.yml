name: Mark stale issues and pull requests

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had any activity for 30 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had any activity for 30 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions.'
          close-issue-message: 'This issue was closed due to inactivity. If you believe this is an error, please reopen it.'
          close-pr-message: 'This pull request was closed due to inactivity. If you believe this is an error, please reopen it.'
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 100
          exempt-issue-labels: 'keep, pinned, security'
          exempt-pr-labels: 'keep, pinned, security'
          exempt-all-milestones: true
