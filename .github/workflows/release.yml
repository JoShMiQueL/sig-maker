name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean changelog (remove commit hash when PR exists)
        run: |
          perl -i -pe 'if (/\[\[#\d+\]\(https:\/\/github\.com\/JoShMiQueL\/sig-maker\/pull\/\d+\)\]/) { s/ \(\w{7}\)\(https:\/\/github\.com\/JoShMiQueL\/sig-maker\/commit\/\w+\)//g; s/ \(\w{7}\)//g; }' CHANGELOG.md || true

      - name: Get previous tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Generate release body
        if: steps.previous_tag.outputs.previous_tag != ''
        run: |
          chmod +x .github/workflows/scripts/generate-release-body.sh
          .github/workflows/scripts/generate-release-body.sh ${{ steps.previous_tag.outputs.previous_tag }} ${{ github.ref_name }} release_notes.md

      - name: Extract changelog section (fallback if no previous tag)
        if: steps.previous_tag.outputs.previous_tag == ''
        id: changelog
        run: |
          CHANGELOG_SECTION=$(awk '/^## \[/{if (++n==2) exit; if (n==1) p=1} p' CHANGELOG.md | sed '1d')
          echo "changelog_section<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Upload release notes
        if: steps.previous_tag.outputs.previous_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }}"
          git push

  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: generate-changelog
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate version
        id: validate
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: validate-version

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

  build-cli:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Build CLI
        uses: michaelklishin/rust-build-package-release-action@v3
        id: build
        with:
          command: release
          target: ${{ matrix.target }}
          archive: 'true'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.build.outputs.artifact_path }}

  build-gui:
    name: Build GUI - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crates/sig-maker-gui/frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: crates/sig-maker-gui -> target

      - name: Install frontend dependencies
        run: |
          cd crates/sig-maker-gui/frontend
          npm ci

      - name: Build GUI
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.platform }}
          path: |
            crates/sig-maker-gui/target/*/release/bundle/*.AppImage
            crates/sig-maker-gui/target/*/release/bundle/*.dmg
            crates/sig-maker-gui/target/*/release/bundle/*.exe
            crates/sig-maker-gui/target/*/release/bundle/*.zip

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [validate, build-cli, build-gui]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: changelog

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
        continue-on-error: true

      - name: Extract changelog section (fallback)
        id: changelog
        run: |
          CHANGELOG_SECTION=$(awk '/^## \[/{if (++n==2) exit; if (n==1) p=1} p' CHANGELOG.md | sed '1d')
          echo "changelog_section<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read release notes
        id: release_notes
        if: hashFiles('release_notes.md') != ''
        run: |
          RELEASE_BODY=$(cat release_notes.md)
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Copy install scripts
        run: |
          cp .github/install.sh install.sh
          cp .github/install.ps1 install.ps1

      - name: Collect artifacts and generate checksums
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: collect-artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: sig-maker ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.release_body || steps.changelog.outputs.changelog_section }}
          draft: true
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/cli-*/*
            artifacts/gui-*/*
            install.sh
            install.ps1
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest CLI binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/cli-*/*

  announce:
    name: Announce Release
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: always() && needs.release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
