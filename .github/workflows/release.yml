name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Read tag version, auto-bump Cargo.toml + tauri.conf.json, push bump commit
  # ---------------------------------------------------------------------------
  pre-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Extract tag version
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [ -z "${TAG}" ]; then
            echo "No version tag found on this commit, skipping."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in Cargo.toml and tauri.conf.json
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update workspace Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          # Update tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" crates/sig-maker-gui/tauri.conf.json
          # Check if anything changed
          if git diff --quiet; then
            echo "Version already at ${VERSION}, no bump needed."
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml crates/sig-maker-gui/tauri.conf.json
            git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build CLI for 5 platforms
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            artifact: sig-maker-cli.exe
            asset: sig-maker-cli-windows-x64.exe

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (ARM64 Linux)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Build CLI (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build GUI for 3 platforms (Windows, Linux, macOS)
  # ---------------------------------------------------------------------------
  build-gui:
    name: Build GUI (${{ matrix.os }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install macOS universal target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.os }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crates/sig-maker-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/sig-maker-gui/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/sig-maker-gui/frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.2" --locked

      - name: Build GUI (Windows - NSIS + Portable)
        if: matrix.os == 'windows-2025-vs2026'
        working-directory: crates/sig-maker-gui
        run: cargo tauri build

      - name: Build GUI (Linux - AppImage)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/sig-maker-gui
        run: cargo tauri build --bundles appimage

      - name: Build GUI (macOS - Universal DMG)
        if: matrix.os == 'macos-latest'
        working-directory: crates/sig-maker-gui
        run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload GUI artifacts (Windows)
        if: matrix.os == 'windows-2025-vs2026'
        uses: actions/upload-artifact@v7
        with:
          name: gui-windows
          path: |
            crates/sig-maker-gui/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload GUI artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: |
            crates/sig-maker-gui/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload GUI artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-macos
          path: |
            crates/sig-maker-gui/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts and SHA-256 checksums
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [pre-checks, build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten and rename artifacts
        run: |
          mkdir -p release/
          # CLI binaries
          cp artifacts/sig-maker-cli-linux-x64/sig-maker-cli         release/sig-maker-cli-linux-x64
          cp artifacts/sig-maker-cli-linux-arm64/sig-maker-cli        release/sig-maker-cli-linux-arm64
          cp artifacts/sig-maker-cli-macos-x64/sig-maker-cli          release/sig-maker-cli-macos-x64
          cp artifacts/sig-maker-cli-macos-arm64/sig-maker-cli        release/sig-maker-cli-macos-arm64
          cp "artifacts/sig-maker-cli-windows-x64.exe/sig-maker-cli.exe" "release/sig-maker-cli-windows-x64.exe"
          # GUI bundles – copy whatever files landed in the artifact dirs
          find artifacts/gui-windows/ -type f | xargs -I{} cp {} release/
          find artifacts/gui-linux/   -type f | xargs -I{} cp {} release/
          find artifacts/gui-macos/   -type f | xargs -I{} cp {} release/
          chmod +x release/sig-maker-cli-linux-* release/sig-maker-cli-macos-*
          ls -lh release/

      - name: Generate SHA-256 checksums
        working-directory: release/
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --strip all --output changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.pre-checks.outputs.tag }}
          tag_name: ${{ needs.pre-checks.outputs.tag }}
          body_path: changelog.md
          prerelease: ${{ needs.pre-checks.outputs.prerelease == 'true' }}
          files: release/*
          fail_on_unmatched_files: true
