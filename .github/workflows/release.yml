name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Validate tag version matches Cargo.toml / tauri.conf.json
  # ---------------------------------------------------------------------------
  pre-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Extract tag version
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [ -z "${TAG}" ]; then
            echo "No version tag found on this commit, skipping."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version is bumped
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VERSION=$(grep '"version"' crates/sig-maker-gui/tauri.conf.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "Tag version: $VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($VERSION). Run: sed -i \"s/^version = \".*\"/version = \\\"$VERSION\\\"/\" Cargo.toml"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$VERSION" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match tag ($VERSION). Run: sed -i \"s/\\\"version\\\": \\\".*\\\"/\\\"version\\\": \\\"$VERSION\\\"/\" crates/sig-maker-gui/tauri.conf.json"
            exit 1
          fi
          echo "Version validation passed."

  # ---------------------------------------------------------------------------
  # Build CLI for 5 platforms
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            artifact: sig-maker-cli.exe
            asset: sig-maker-cli-windows-x64.exe

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
          cache-all-crates: true
          cache-on-failure: true

      - name: Cache cross binary
        if: matrix.cross == true
        uses: actions/cache@v5
        id: cache-cross
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cross (ARM64 Linux)
        if: matrix.cross == true && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --locked --version 0.2.5

      - name: Build CLI (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Build CLI (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build GUI for 3 platforms
  # ---------------------------------------------------------------------------
  build-gui:
    name: Build GUI (${{ matrix.os-name }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            os-name: Windows
            bundle: nsis
          - os: ubuntu-latest
            os-name: Linux
            bundle: appimage
          - os: macos-latest
            os-name: macOS
            bundle: dmg

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.os-name }}
          cache-all-crates: true
          cache-on-failure: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crates/sig-maker-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/sig-maker-gui/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/sig-maker-gui/frontend
        run: npm run build

      - name: Cache Tauri CLI (npm global, Windows)
        if: matrix.os == 'windows-2025-vs2026'
        uses: actions/cache@v5
        id: cache-tauri-cli-win
        with:
          path: |
            ${{ env.APPDATA }}\npm\node_modules\@tauri-apps
            ${{ env.APPDATA }}\npm\tauri*
          key: tauri-cli-npm-2-Windows

      - name: Cache Tauri CLI (npm global, Unix)
        if: matrix.os != 'windows-2025-vs2026'
        uses: actions/cache@v5
        id: cache-tauri-cli-unix
        with:
          path: |
            /usr/local/lib/node_modules/@tauri-apps
            /usr/local/bin/tauri
          key: tauri-cli-npm-2-${{ matrix.os-name }}

      - name: Cache linuxdeploy (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/tauri/linuxdeploy
            ~/.cache/tauri/linuxdeploy-plugin-*
          key: linuxdeploy-2024

      - name: Install Tauri CLI
        if: |
          (matrix.os == 'windows-2025-vs2026' && steps.cache-tauri-cli-win.outputs.cache-hit != 'true') ||
          (matrix.os != 'windows-2025-vs2026' && steps.cache-tauri-cli-unix.outputs.cache-hit != 'true')
        run: npm install -g @tauri-apps/cli@2

      - name: Build GUI
        working-directory: crates/sig-maker-gui
        run: tauri build --bundles ${{ matrix.bundle }}

      - name: Create portable ZIP (Windows only)
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $version = "${{ needs.pre-checks.outputs.tag }}"
          $zip = "target/release/bundle/nsis/sig-maker-gui_${version}_x64_portable.zip"
          $tmpDir = "target/release/bundle/nsis/portable-temp"
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          Copy-Item $exe.FullName $tmpDir/
          Copy-Item README.md $tmpDir/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE $tmpDir/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md $tmpDir/ -ErrorAction SilentlyContinue
          Compress-Archive -Path "$tmpDir/*" -DestinationPath $zip -Force
          Remove-Item -Recurse -Force $tmpDir
          Write-Host "Created portable: $zip"

      - name: Upload GUI artifacts (Windows)
        if: matrix.os == 'windows-2025-vs2026'
        uses: actions/upload-artifact@v7
        with:
          name: gui-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.zip
          if-no-files-found: error

      - name: Upload GUI artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload GUI artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts and SHA-256 checksums
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [pre-checks, build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Prepare release assets
        id: assets
        run: |
          mkdir -p release/
          TAG="${{ needs.pre-checks.outputs.tag }}"
          VERSION="${TAG#v}"

          # --- CLI: compress + individual .sha256 ---
          tar -cJf release/sig-maker-cli-x86_64-unknown-linux-gnu.tar.xz \
            -C artifacts/sig-maker-cli-linux-x64 sig-maker-cli
          tar -cJf release/sig-maker-cli-aarch64-unknown-linux-gnu.tar.xz \
            -C artifacts/sig-maker-cli-linux-arm64 sig-maker-cli
          tar -cJf release/sig-maker-cli-x86_64-apple-darwin.tar.xz \
            -C artifacts/sig-maker-cli-macos-x64 sig-maker-cli
          tar -cJf release/sig-maker-cli-aarch64-apple-darwin.tar.xz \
            -C artifacts/sig-maker-cli-macos-arm64 sig-maker-cli
          (cd artifacts/sig-maker-cli-windows-x64.exe && zip -q "${GITHUB_WORKSPACE}/release/sig-maker-cli-x86_64-pc-windows-msvc.zip" sig-maker-cli.exe)

          for f in release/sig-maker-cli-*.tar.xz release/sig-maker-cli-*.zip; do
            sha256sum "$f" > "$f.sha256"
          done

          # --- GUI ---
          find artifacts/gui-linux/   -type f -name '*.AppImage' | xargs -I{} cp {} release/
          find artifacts/gui-macos/   -type f -name '*.dmg'      | xargs -I{} cp {} release/
          find artifacts/gui-windows/ -type f | xargs -I{} cp {} release/

          # --- source.tar.gz ---
          git archive --format=tar.gz -o release/source.tar.gz HEAD
          sha256sum release/source.tar.gz > release/source.tar.gz.sha256

          # --- Install scripts (renamed) ---
          cp scripts/install.sh  release/sig-maker-installer.sh
          cp scripts/install.ps1 release/sig-maker-installer.ps1
          chmod +x release/sig-maker-installer.sh

          # --- sha256.sum (all release files except itself) ---
          (cd release && sha256sum * > sha256.sum)

          ls -lh release/

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
          git-cliff "${PREV_TAG}..HEAD" --output changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release body
        run: |
          TAG="${{ needs.pre-checks.outputs.tag }}"
          VERSION="${TAG#v}"

          python3 - "$TAG" "$VERSION" << 'PYEOF'
          import sys
          tag, version = sys.argv[1], sys.argv[2]
          lines = [
              "",
              f"## Install sig-maker {version}",
              "",
              "### Install prebuilt binaries via shell script",
              "",
              "```sh",
              f"curl --proto '=https' --tlsv1.2 -LsSf https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-installer.sh | sh",
              "```",
              "",
              "### Install prebuilt binaries via powershell script",
              "",
              "```sh",
              f'powershell -ExecutionPolicy Bypass -c "irm https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-installer.ps1 | iex"',
              "```",
              "",
              f"## Download sig-maker {version}",
              "",
              "| File | Platform | Checksum |",
              "|------|----------|----------|",
              f"| [sig-maker-cli-aarch64-apple-darwin.tar.xz](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-aarch64-apple-darwin.tar.xz.sha256) |",
              f"| [sig-maker-cli-x86_64-apple-darwin.tar.xz](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-apple-darwin.tar.xz.sha256) |",
              f"| [sig-maker-cli-x86_64-pc-windows-msvc.zip](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-pc-windows-msvc.zip.sha256) |",
              f"| [sig-maker-cli-aarch64-unknown-linux-gnu.tar.xz](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-aarch64-unknown-linux-gnu.tar.xz.sha256) |",
              f"| [sig-maker-cli-x86_64-unknown-linux-gnu.tar.xz](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/JoShMiQueL/sig-maker/releases/download/{tag}/sig-maker-cli-x86_64-unknown-linux-gnu.tar.xz.sha256) |",
          ]
          with open("install_section.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

          cat changelog.md install_section.md > release_body.md

      - name: Delete existing release (if any)
        run: |
          gh release delete "${{ needs.pre-checks.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.pre-checks.outputs.tag }}
          tag_name: ${{ needs.pre-checks.outputs.tag }}
          body_path: release_body.md
          prerelease: ${{ needs.pre-checks.outputs.prerelease == 'true' }}
          files: release/*
          fail_on_unmatched_files: true
