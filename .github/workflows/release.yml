name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Read tag version, auto-bump Cargo.toml + tauri.conf.json, push bump commit
  # ---------------------------------------------------------------------------
  pre-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Extract tag version
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [ -z "${TAG}" ]; then
            echo "No version tag found on this commit, skipping."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in Cargo.toml and tauri.conf.json
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update workspace Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          # Update tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" crates/sig-maker-gui/tauri.conf.json
          # Check if anything changed
          if git diff --quiet; then
            echo "Version already at ${VERSION}, no bump needed."
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml crates/sig-maker-gui/tauri.conf.json
            git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build CLI for 5 platforms
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sig-maker-cli
            asset: sig-maker-cli-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            artifact: sig-maker-cli.exe
            asset: sig-maker-cli-windows-x64.exe

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
          cache-on-failure: true

      - name: Cache cross binary
        if: matrix.cross == true
        uses: actions/cache@v5
        id: cache-cross
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cross (ARM64 Linux)
        if: matrix.cross == true && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --locked --version 0.2.5

      - name: Build CLI (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Build CLI (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} --bin sig-maker-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build GUI for 3 platforms
  # E0119 fixed: Cargo.lock pins tauri-utils=2.8.3 + time=0.3.46
  # ---------------------------------------------------------------------------
  build-gui:
    name: Build GUI (${{ matrix.os-name }})
    needs: pre-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            os-name: Windows
            bundle: nsis
          - os: ubuntu-latest
            os-name: Linux
            bundle: appimage
          - os: macos-latest
            os-name: macOS
            bundle: dmg

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.os-name }}
          cache-on-failure: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crates/sig-maker-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/sig-maker-gui/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/sig-maker-gui/frontend
        run: npm run build

      - name: Cache Tauri CLI (npm global, Windows)
        if: matrix.os == 'windows-2025-vs2026'
        uses: actions/cache@v5
        id: cache-tauri-cli-win
        with:
          path: |
            ${{ env.APPDATA }}\npm\node_modules\@tauri-apps
            ${{ env.APPDATA }}\npm\tauri*
          key: tauri-cli-npm-2-Windows

      - name: Cache Tauri CLI (npm global, Unix)
        if: matrix.os != 'windows-2025-vs2026'
        uses: actions/cache@v5
        id: cache-tauri-cli-unix
        with:
          path: |
            /usr/local/lib/node_modules/@tauri-apps
            /usr/local/bin/tauri
          key: tauri-cli-npm-2-${{ matrix.os-name }}

      - name: Install Tauri CLI
        if: |
          (matrix.os == 'windows-2025-vs2026' && steps.cache-tauri-cli-win.outputs.cache-hit != 'true') ||
          (matrix.os != 'windows-2025-vs2026' && steps.cache-tauri-cli-unix.outputs.cache-hit != 'true')
        run: npm install -g @tauri-apps/cli@2

      - name: Build GUI
        working-directory: crates/sig-maker-gui
        run: tauri build --bundles ${{ matrix.bundle }}

      - name: Create portable ZIP (Windows only)
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "crates/sig-maker-gui/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $version = "${{ needs.pre-checks.outputs.tag }}"
          $zip = "crates/sig-maker-gui/target/release/bundle/nsis/sig-maker-gui_${version}_x64_portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip
          Write-Host "Created portable: $zip"

      - name: Upload GUI artifacts (Windows)
        if: matrix.os == 'windows-2025-vs2026'
        uses: actions/upload-artifact@v7
        with:
          name: gui-windows
          path: |
            crates/sig-maker-gui/target/release/bundle/nsis/*.exe
            crates/sig-maker-gui/target/release/bundle/nsis/*.zip
          if-no-files-found: error

      - name: Upload GUI artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: crates/sig-maker-gui/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload GUI artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gui-macos
          path: crates/sig-maker-gui/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts and SHA-256 checksums
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [pre-checks, build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-checks.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten and rename artifacts
        run: |
          mkdir -p release/
          # CLI binaries
          cp artifacts/sig-maker-cli-linux-x64/sig-maker-cli         release/sig-maker-cli-linux-x64
          cp artifacts/sig-maker-cli-linux-arm64/sig-maker-cli        release/sig-maker-cli-linux-arm64
          cp artifacts/sig-maker-cli-macos-x64/sig-maker-cli          release/sig-maker-cli-macos-x64
          cp artifacts/sig-maker-cli-macos-arm64/sig-maker-cli        release/sig-maker-cli-macos-arm64
          cp "artifacts/sig-maker-cli-windows-x64.exe/sig-maker-cli.exe" "release/sig-maker-cli-windows-x64.exe"
          # GUI bundles (all platforms)
          find artifacts/gui-windows/ -type f | xargs -I{} cp {} release/
          find artifacts/gui-linux/   -type f | xargs -I{} cp {} release/
          find artifacts/gui-macos/   -type f | xargs -I{} cp {} release/
          # Install scripts
          cp scripts/install.sh  release/install.sh
          cp scripts/install.ps1 release/install.ps1
          chmod +x release/sig-maker-cli-linux-* release/sig-maker-cli-macos-* release/install.sh
          ls -lh release/

      - name: Generate SHA-256 checksums
        working-directory: release/
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --strip all --output changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.pre-checks.outputs.tag }}
          tag_name: ${{ needs.pre-checks.outputs.tag }}
          body_path: changelog.md
          prerelease: ${{ needs.pre-checks.outputs.prerelease == 'true' }}
          files: release/*
          fail_on_unmatched_files: true
