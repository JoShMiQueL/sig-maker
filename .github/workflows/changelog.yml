name: Generate Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    # Don't run on commits made by the bot itself or on commits that already updated changelog
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, 'docs: update CHANGELOG.md')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Check if changelog changed
        id: check_changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch
        id: branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          BRANCH="changelog/update-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md [skip ci]"

      - name: Push branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Ensure label exists
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          gh label create automated --color "0066cc" --description "Automated PR generated by workflow" || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create PR
        id: pr
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          PR_URL=$(gh pr create --title "docs: update CHANGELOG.md" --body "Auto-generated changelog update" --base main --head "${{ steps.branch.outputs.branch }}" --label "automated")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$(echo $PR_URL | grep -oP 'pull/\K[0-9]+')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Wait for CI checks
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          gh pr checks "${{ steps.pr.outputs.pr_number }}" --wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Auto-merge PR
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.pr_number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Cleanup old PRs
        if: always()
        run: |
          # Close PRs older than 1 hour with automated label
          gh pr list --label automated --state open --json number,title,createdAt --jq '.[] | select(.createdAt < "'$(date -d '1 hour ago' -u +%Y-%m-%dT%H:%M:%SZ)'"') | .number' | xargs -I {} gh pr close {} --delete-branch --comment "Auto-closed stale automated PR" || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
