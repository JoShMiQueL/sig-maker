name: Generate Changelog

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    # Don't run on commits made by the bot itself
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate changelog
        uses: ./.github/actions/generate-changelog
        with:
          commit: 'false'

      - name: Check if changelog changed
        id: check_changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch
        id: branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          BRANCH="changelog/update-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md [skip ci]"

      - name: Push branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create PR
        id: pr
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          PR_URL=$(gh pr create --title "docs: update CHANGELOG.md" --body "Auto-generated changelog update" --base main --head "${{ steps.branch.outputs.branch }}" --label "automated")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$(echo $PR_URL | grep -oP 'pull/\K[0-9]+')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI checks
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          gh pr checks "${{ steps.pr.outputs.pr_number }}" --watch --interval 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.pr_number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
