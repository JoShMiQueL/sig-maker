name: Generate Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    # Don't run on commits made by the bot itself
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create branch
        id: branch
        run: |
          BRANCH="changelog/update-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"

      - name: Push branch
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create PR
        id: pr
        run: |
          PR_URL=$(gh pr create --title "docs: update CHANGELOG.md" --body "Auto-generated changelog update" --base main --head "${{ steps.branch.outputs.branch }}" --label "automated")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Auto-merge PR
        run: |
          gh pr merge "${{ steps.pr.outputs.pr_url }}" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
