name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.devin/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.devin/**'
      - '.github/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  SIG_MAKER_NO_PAUSE: "1"

jobs:
  test-core:
    name: Test Core & CLI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy on core
        run: cargo clippy --package sig-maker-core -- -D warnings

      - name: Run clippy on CLI
        run: cargo clippy --package sig-maker-cli -- -D warnings

      - name: Run tests on core
        run: cargo test --package sig-maker-core --verbose

      - name: Run tests on CLI
        run: cargo test --package sig-maker-cli --verbose -- --nocapture

      - name: Build core library
        run: cargo build --package sig-maker-core

      - name: Build CLI
        run: cargo build --package sig-maker-cli
