name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.devin/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.devin/**'
      - '.github/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  SIG_MAKER_NO_PAUSE: "1"

jobs:
  test-core:
    name: Test Core & CLI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy on core
        run: cargo clippy --package sig-maker-core -- -D warnings

      - name: Run clippy on CLI
        run: cargo clippy --package sig-maker-cli -- -D warnings

      - name: Run tests on core
        run: cargo test --package sig-maker-core --verbose

      - name: Run tests on CLI
        run: cargo test --package sig-maker-cli --verbose -- --nocapture

      - name: Build core library
        run: cargo build --package sig-maker-core

      - name: Build CLI
        run: cargo build --package sig-maker-cli

  test-gui:
    name: Test GUI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crates/sig-maker-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd crates/sig-maker-gui/frontend
          npm ci

      - name: Build frontend
        run: |
          cd crates/sig-maker-gui/frontend
          npm run build

      - name: Run clippy on GUI
        run: cargo clippy --package sig-maker-gui -- -D warnings
        continue-on-error: true

      - name: Run tests on GUI
        run: cargo test --package sig-maker-gui --verbose
        continue-on-error: true

      - name: Build GUI
        run: cargo build --package sig-maker-gui
        continue-on-error: true
