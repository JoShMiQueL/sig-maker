name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: test

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy on core
        run: cargo clippy --package sig-maker-core -- -D warnings

      - name: Run tests on core
        run: cargo test --package sig-maker-core --verbose

      - name: Build core library
        run: cargo build --package sig-maker-core

      - name: Build CLI
        run: cargo build --package sig-maker-cli
