[workspace]
members = [
    "crates/sig-maker-core",
    "crates/sig-maker-cli",
]
resolver = "2"

[workspace.metadata.cargo-sig-maker]
# Additional metadata can be added here

[workspace.package]
version = "0.1.2-beta"
edition = "2024"
authors = ["JoShMiQueL"]
description = "Multi-format signature/pattern converter and optimizer"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/JoShMiQueL/sig-maker"
keywords = ["signature", "pattern", "aob", "reverse-engineering", "cheat-engine", "binary"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
