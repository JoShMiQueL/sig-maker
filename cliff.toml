# git-cliff configuration file
# https://git-cliff.org/docs/configuration/

[changelog]
header = """
# Changelog\n\n
All notable changes to this project will be documented in this file.\n\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\n
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n
"""
body = """
{% if version %}\n
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\n
{% else %}\n
## [Unreleased]\n
{% endif %}\n
{% for group, commits in commits | group_by(attribute="group") %}\n
### {{ group | striptags | trim | upper_first }}\n
{% for commit in commits %}\n
- {{ commit.message | upper_first | trim }}\n
{% endfor %}\n
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = "\\((\\w+\\s*)#\\d+\\)", replace = "([#${1}])" },
    { pattern = "^Merge pull request #\\d+ from ", replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactoring" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^docs", group = "📚 Documentation" },
    { message = "^style", group = "💄 Styling" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "⚙️ Miscellaneous" },
    { message = "^ci", group = "🔁 CI/CD" },
    { body = "^.+", group = "📝 Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.0"
ignore_tags = ""
top_order = false
sort_commits = "oldest"
