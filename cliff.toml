[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}
{% endfor %}
{% endfor -%}

{%- if github -%}
{%- set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) -%}
{%- set_global has_new_human = false -%}
{%- for contributor in new_contributors -%}
  {%- if not contributor.username is containing("[bot]") -%}
    {%- set_global has_new_human = true -%}
  {%- endif -%}
{%- endfor -%}
{%- if has_new_human %}
### New Contributors

{% for contributor in new_contributors -%}
  {%- if not contributor.username is containing("[bot]") -%}
* [@{{ contributor.username }}](https://github.com/{{ contributor.username }}) made their first contribution\
    {%- if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){%- endif %}
  {%- endif -%}
{%- endfor %}
{%- endif -%}
{%- endif %}

{%- set contributors_list = commits | filter(attribute="remote.username") | map(attribute="remote.username") | unique | sort -%}
{%- if contributors_list | length != 0 %}
### Contributors

{% for username in contributors_list -%}
  {%- if not username is containing("[bot]") -%}
* [@{{ username }}](https://github.com/{{ username }})
  {%- endif %}
{%- endfor %}
{%- endif %}

{% if version and release.previous.version -%}
**Full Changelog**: [{{ release.previous.version }}...{{ version }}]({{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ version }})
{%- endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # Skip changelog/bot/merge commits
    { message = "^docs: update CHANGELOG", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(changelog\\)", skip = true },
    { message = "^ci\\(changelog\\)", skip = true },
    { message = "^feat\\(changelog\\)", skip = true },
    { message = "^fix\\(changelog\\)", skip = true },
    { message = "^refactor\\(changelog\\)", skip = true },
    { message = "changelog", skip = true },
    { message = "git-cliff", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^Merge pull request", skip = true },
    { author = ".*\\[bot\\]", skip = true },
    { author = "dependabot\\[bot\\]", skip = true },
    { author = "dependabot", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    # Skip internal/minor changes
    { message = "TODO\\.md", skip = true },
    { message = "(?i)^chore\\(.*\\).*formatting", skip = true },
    { message = "(?i)^chore\\(.*\\).*config", skip = true },
    # Group rules
    { message = "(?i)^feat", group = "Features" },
    { message = "(?i)^fix", group = "Bug Fixes" },
    { message = "(?i)^docs?", group = "Documentation" },
    { message = "(?i)^perf", group = "Performance" },
    { message = "(?i)^refactor", group = "Refactor" },
    { message = "(?i)^style", group = "Styling" },
    { message = "(?i)^test", group = "Testing" },
    { message = "(?i)^ci", group = "CI/CD" },
    { message = "(?i)^chore", group = "Miscellaneous" },
    { message = "(?i)^build", group = "Build" },
    { message = "(?i)^revert", group = "Reverts" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

[remote.github]
owner = "JoShMiQueL"
repo = "sig-maker"
