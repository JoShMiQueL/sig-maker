[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){%- endif %}\
            {% if commit.remote.pr_number %} in \
              [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})\
            {%- endif %} \
            ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}

{%- if github -%}
{%- set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) %}
{%- set_global has_new_human = false -%}
{%- for contributor in new_contributors -%}
    {%- if not contributor.username is containing("[bot]") -%}
        {%- set_global has_new_human = true -%}
    {%- endif -%}
{%- endfor -%}
{%- if has_new_human %}

    ### New Contributors
{% for contributor in new_contributors -%}
    {%- if not contributor.username is containing("[bot]") %}
    * [@{{ contributor.username }}](https://github.com/{{ contributor.username }}) made their first contribution\
        {%- if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){%- endif %}
{%- endif -%}
{%- endfor %}
{%- endif %}
{%- endif %}

{%- set contributors_list = commits | filter(attribute="remote.username") | map(attribute="remote.username") | unique %}
{%- if contributors_list | length != 0 %}

    ### Contributors
{% for username in contributors_list %}
    * [@{{ username }}](https://github.com/{{ username }}) — \
        {%- set user_commits = commits | filter(attribute="remote.username", value=username) -%}
        {%- for commit in user_commits -%}
            {%- if commit.remote.pr_number %} [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})\
            {%- else %} [`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }})\
            {%- endif -%}
            {%- if not loop.last %},{% endif -%}
        {%- endfor %}
{%- endfor %}
{%- endif %}

{% if version and release.previous.version -%}
    **Full Changelog**: [{{ release.previous.version }}...{{ version }}]({{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ version }})
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # Skip changelog bot commits (must be before other doc/chore rules)
    { message = "^docs: update CHANGELOG", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { author = ".*\\[bot\\]", skip = true },
    # Group rules
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore", group = "Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

[remote.github]
owner = "JoShMiQueL"
repo = "sig-maker"
